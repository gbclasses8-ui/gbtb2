    <!-- Runtime replacement guard to ensure "spidy" is transformed to "GB" everywhere -->
    <script>
      (function() {
        function sanitizeText(str) {
          if (typeof str !== 'string') return str;
          return str
            .replace(/SPIDY\s*STUDY/gi, 'GB STUDY')
            .replace(/Spidy\s*Study/gi, 'GB Study')
            .replace(/spidy\s*study/gi, 'gb study')
            .replace(/SPIDY/g, 'GB')
            .replace(/Spidy/g, 'GB')
            .replace(/spidy/g, 'GB');
        }

        // Global DOM cleaner
        function cleanNode(node) {
          if (!node) return;
          if (node.nodeType === Node.TEXT_NODE) {
            if (node.nodeValue && /spidy/i.test(node.nodeValue)) {
              node.nodeValue = sanitizeText(node.nodeValue);
            }
          } else if (node.nodeType === Node.ELEMENT_NODE) {
            const attrs = ['title', 'placeholder', 'alt', 'aria-label', 'value'];
            for (const a of attrs) {
              const val = node.getAttribute && node.getAttribute(a);
              if (val && /spidy/i.test(val)) {
                node.setAttribute(a, sanitizeText(val));
              }
            }
            if (node.childNodes && node.childNodes.length > 0) {
              for (let i = 0; i < node.childNodes.length; i++) {
                cleanNode(node.childNodes[i]);
              }
            }
          }
        }

        const observer = new MutationObserver((mutations) => {
          for (const m of mutations) {
            if (m.type === 'childList') {
              m.addedNodes.forEach(cleanNode);
            } else if (m.type === 'characterData') {
              cleanNode(m.target);
            }
          }
        });

        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', () => {
            cleanNode(document.body);
            observer.observe(document.body, { childList: true, subtree: true, characterData: true });
          });
        } else {
          cleanNode(document.body);
          observer.observe(document.body, { childList: true, subtree: true, characterData: true });
        }

        // Intercept fetch to replace spidy in JSON responses
        const origFetch = window.fetch;
        window.fetch = async function(...args) {
          const res = await origFetch.apply(this, args);
          const origJson = res.json;
          res.json = async function() {
            const data = await origJson.apply(this);
            const str = JSON.stringify(data);
            if (/spidy/i.test(str)) {
              return JSON.parse(sanitizeText(str));
            }
            return data;
          };
          return res;
        };
      })();
    </script>
